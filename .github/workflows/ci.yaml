name: CI
# No path filters here: the CI check is required on pull requests, and a skipped workflow never reports it.
# Instead, the changes job skips lint and tests when only documentation changed.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SHFMT: mvdan/shfmt:v3.14.1

jobs:
  changes:
    name: Detect changes
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      # code=false only if every changed file is documentation. Anything unexpected runs everything.
      - name: Check for non-documentation changes
        id: diff
        run: |
          case $EVENT in
            pull_request) range=$BASE...$HEAD ;;
            push) range=$BEFORE..$AFTER ;;
            *) range= ;;
          esac
          if [ -z "$range" ] || ! files=$(git diff --name-only "$range"); then
            echo "Could not list changed files, running everything"
            echo code=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s\n' "$files"
          if grep -qvE '^([^/]+\.md|LICENSE)$' <<< "$files"; then
            echo code=true >> "$GITHUB_OUTPUT"
          else
            echo "Only documentation changed, skipping lint and tests"
            echo code=false >> "$GITHUB_OUTPUT"
          fi
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Every linter runs even if an earlier one fails, so one push shows every problem.
      # shfmt -f finds every shell script by extension or shebang, so new scripts are linted too.
      - name: ShellCheck
        if: ${{ !cancelled() }}
        run: |
          mapfile -t files < <(docker run --rm -v "$PWD:/mnt" -w /mnt "$SHFMT" -f .)
          printf '%s\n' "${files[@]}"
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.11.0 "${files[@]}"

      - name: shfmt
        if: ${{ !cancelled() }}
        run: docker run --rm -v "$PWD:/mnt" -w /mnt "$SHFMT" -d .

      - name: actionlint
        if: ${{ !cancelled() }}
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color

      - name: zizmor
        if: ${{ !cancelled() }}
        run: docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/zizmorcore/zizmor:1.30.1 --offline --format github .

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu, OpenSSL
            runner: ubuntu-latest
          - name: Ubuntu, wg
            runner: ubuntu-latest
            wg: apt
          # Apple's LibreSSL can't generate X25519 keys, so macOS users need wireguard-tools.
          - name: macOS, wg
            runner: macos-latest
            wg: brew
    name: Test (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    permissions:
      contents: read
    runs-on: ${{ matrix.runner }}
    # Jobs take under a minute. Without a limit, a hung apt-get blocks a PR for up to 6 hours.
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install wireguard-tools with apt
        if: matrix.wg == 'apt'
        timeout-minutes: 5
        run: sudo apt-get -qq update && sudo apt-get -qq install --no-install-recommends wireguard-tools

      - name: Install wireguard-tools with Homebrew
        if: matrix.wg == 'brew'
        timeout-minutes: 5
        run: brew install --quiet wireguard-tools

      - name: Show tool versions
        run: |
          bash --version | head -n 1
          jq --version
          command -v wg || openssl version

      - name: Run tests
        run: bash tests/test.sh

  # The one check the main branch ruleset requires, so jobs can be added or renamed without editing the ruleset.
  ci:
    name: CI
    needs: [changes, lint, test]
    if: ${{ always() }}
    permissions: {}
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      # Lint and tests may be skipped for documentation-only changes, but only if the changes job succeeded.
      - name: Check every job passed or was skipped
        run: |
          echo "$RESULTS"
          jq -e '.changes.result == "success" and all(.[]; .result == "success" or .result == "skipped")' <<< "$RESULTS"
        env:
          RESULTS: ${{ toJSON(needs) }}
