name: Smoke test
on:
  schedule:
    - cron: '7 11 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}

jobs:
  smoke-test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Registers a real Mesh node with a dedicated test token, then deletes it with the device profile it saved.
      - name: Register and delete
        working-directory: ${{ runner.temp }}
        run: |
          [ -n "$MESH_TOKEN" ] || { echo "::error::The MESH_TOKEN repository secret is not set"; exit 1; }
          script=$GITHUB_WORKSPACE/wgcf-mesh.sh
          bash "$script" - <<< "$MESH_TOKEN"
          conf=(wgcf-mesh-*.conf)
          profile=(wgcf-mesh-*.json)
          [ ${#profile[@]} -eq 1 ] && [ -f "${profile[0]}" ] || { echo "::error::Expected one device profile"; exit 1; }
          # If a check below fails, still delete the device so it isn't left behind.
          trap '[ ! -f "${profile[0]}" ] || bash "$script" --delete "${profile[0]}"' EXIT
          [ ${#conf[@]} -eq 1 ] && [ -f "${conf[0]}" ] || { echo "::error::Expected one configuration file"; exit 1; }
          # Check the layout without printing addresses to the public log.
          for line in '^PrivateKey = ' '^Address = .+/128, .+/32$' '^PublicKey = ' '^Endpoint = '; do
            grep -Eq "$line" "${conf[0]}" || { echo "::error::No line matching $line"; exit 1; }
          done
          bash "$script" --delete "${profile[0]}"
          [ -e "${profile[0]}" ] || { echo "::error::The device profile was removed"; exit 1; }
          # --delete keeps the profile, so remove it here or the trap above would delete again.
          rm -f "${profile[0]}"
          rm -f "${conf[0]}"
        env:
          MESH_TOKEN: ${{ secrets.MESH_TOKEN }}
