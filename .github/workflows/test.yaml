name: Test
on:
  push:
    branches:
      - main
    paths:
      - wgcf-mesh.sh
      - tests/**
      - .github/workflows/test.yaml
  pull_request:
    paths:
      - wgcf-mesh.sh
      - tests/**
      - .github/workflows/test.yaml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run ShellCheck
        run: shellcheck wgcf-mesh.sh tests/test.sh tests/stub/curl

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu, OpenSSL
            runner: ubuntu-latest
          - name: Ubuntu, wg
            runner: ubuntu-latest
            wg: true
          - name: macOS, LibreSSL
            runner: macos-latest
            libressl: true
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install wireguard-tools
        if: matrix.wg
        run: sudo apt-get -qq update && sudo apt-get -qq install --no-install-recommends wireguard-tools

      # The runner has Homebrew OpenSSL first on PATH, but users get Apple's LibreSSL.
      - name: Use the system LibreSSL
        if: matrix.libressl
        run: |
          mkdir "$RUNNER_TEMP/bin"
          ln -s /usr/bin/openssl "$RUNNER_TEMP/bin/openssl"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Show tool versions
        run: |
          bash --version | head -n 1
          jq --version
          command -v wg || openssl version

      - name: Run tests
        run: bash tests/test.sh
